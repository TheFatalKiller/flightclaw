name: Perth Flight Price Alerts

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. Scheduled GitHub runs can start a little late.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: perth-flight-price-tracker
  cancel-in-progress: false

jobs:
  check-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Google Flights with SerpApi
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          DATES = ["2027-01-10", "2027-01-11", "2027-01-12", "2027-01-13"]
          LONDON_AIRPORTS = {"LHR", "LGW", "STN", "LTN", "LCY", "SEN"}
          DEPARTURE_ID = "LHR,LGW,STN,LTN,LCY,SEN"
          DESTINATION = "PER"
          HIGH_PRIORITY_PRICE = 750
          URGENT_PRICE = 700
          MAX_DURATION_MINUTES = 25 * 60  # strictly under 25h
          FILTER_SIGNATURE = (
              "serpapi-deep-lon-per-2027-01-10_13-"
              "economy-max1-under25h-single-ticket-v1"
          )
          STATE_FILE = Path(".flight-alert-state.json")
          NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "").strip()
          SERPAPI_KEY = os.environ.get("SERPAPI_KEY", "").strip()
          SERPAPI_URL = "https://serpapi.com/search.json"
          FALLBACK_URL = "https://www.google.com/travel/flights?hl=en&gl=uk&curr=GBP"

          if not NTFY_TOPIC:
              raise RuntimeError("NTFY_TOPIC secret is missing.")

          if not SERPAPI_KEY:
              raise RuntimeError("SERPAPI_KEY secret is missing.")


          def as_price(value):
              try:
                  return None if value is None else float(value)
              except (TypeError, ValueError):
                  return None


          def normalise_url(url):
              if not url:
                  return FALLBACK_URL

              url = str(url).strip()

              if url.startswith("//"):
                  return "https:" + url

              return (
                  url
                  if url.startswith(("http://", "https://"))
                  else FALLBACK_URL
              )


          def serpapi_request(params, label, attempts=3):
              params = dict(params)
              params["api_key"] = SERPAPI_KEY

              url = (
                  SERPAPI_URL
                  + "?"
                  + urllib.parse.urlencode(params)
              )

              last_error = None

              for attempt in range(1, attempts + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "flight-price-tracker/1.0",
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=180,
                      ) as response:
                          data = json.loads(
                              response.read().decode("utf-8")
                          )

                      if data.get("error"):
                          raise RuntimeError(
                              str(data["error"])
                          )

                      if (
                          data.get(
                              "search_metadata",
                              {},
                          ).get("status")
                          == "Error"
                      ):
                          raise RuntimeError(
                              str(
                                  data.get("error")
                                  or
                                  "SerpApi returned search status Error."
                              )
                          )

                      return data

                  except urllib.error.HTTPError as exc:
                      try:
                          body = (
                              exc.read()
                              .decode(
                                  "utf-8",
                                  errors="replace",
                              )
                              .strip()
                          )
                      except Exception:
                          body = ""

                      safe_body = body.replace(
                          SERPAPI_KEY,
                          "***",
                      )

                      detail = (
                          f"HTTP {exc.code}: "
                          f"{exc.reason}"
                      )

                      if safe_body:
                          try:
                              parsed = json.loads(
                                  safe_body
                              )

                              if (
                                  isinstance(parsed, dict)
                                  and parsed.get("error")
                              ):
                                  detail += (
                                      " | "
                                      + str(
                                          parsed["error"]
                                      )
                                  )
                              else:
                                  detail += (
                                      " | "
                                      + safe_body[:500]
                                  )

                          except Exception:
                              detail += (
                                  " | "
                                  + safe_body[:500]
                              )

                      last_error = detail

                      print(
                          f"{label} attempt "
                          f"{attempt}/{attempts} failed: "
                          f"{last_error}"
                      )

                      # HTTP 400 means the same request
                      # will not become valid by retrying.
                      if exc.code == 400:
                          raise RuntimeError(
                              f"{label} failed: "
                              f"{last_error}"
                          ) from exc

                      if attempt < attempts:
                          time.sleep(
                              8
                              if attempt == 1
                              else 20
                          )

                  except Exception as exc:
                      last_error = (
                          str(exc)
                          .replace(
                              SERPAPI_KEY,
                              "***",
                          )
                      )

                      print(
                          f"{label} attempt "
                          f"{attempt}/{attempts} failed: "
                          f"{last_error}"
                      )

                      if attempt < attempts:
                          time.sleep(
                              8
                              if attempt == 1
                              else 20
                          )

              raise RuntimeError(
                  f"{label} failed after "
                  f"{attempts} attempts: "
                  f"{last_error}"
              )


          def send_notification(
              title,
              message,
              priority=3,
              tags=None,
              click_url=None,
          ):
              payload = {
                  "topic": NTFY_TOPIC,
                  "title": title,
                  "message": message,
                  "priority": int(priority),
                  "tags": tags or ["airplane"],
                  "click": normalise_url(
                      click_url
                  ),
              }

              request = urllib.request.Request(
                  "https://ntfy.sh",
                  data=json.dumps(
                      payload
                  ).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type":
                      "application/json"
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  print(
                      "ntfy notification sent: "
                      f"{response.status} "
                      f"{title}"
                  )


          def format_date(value):
              return datetime.strptime(
                  value,
                  "%Y-%m-%d",
              ).strftime(
                  "%d %b %Y"
              )


          def format_duration(minutes):
              minutes = int(minutes)

              return (
                  f"{minutes // 60}h "
                  f"{minutes % 60:02d}m"
              )


          def priority_for_price(price):
              price = float(price)

              if price < URGENT_PRICE:
                  return 5

              if price < HIGH_PRIORITY_PRICE:
                  return 4

              return 3


          def airport_id(block):
              if (
                  not isinstance(block, dict)
                  or block.get("id") is None
              ):
                  return None

              return str(
                  block["id"]
              ).upper()


          def parse_candidate(
              row,
              date,
              search_url,
          ):
              if not isinstance(row, dict):
                  return None

              shopping_price = as_price(
                  row.get("price")
              )

              if shopping_price is None:
                  return None

              try:
                  duration = int(
                      row.get("total_duration")
                  )
              except (
                  TypeError,
                  ValueError,
              ):
                  return None

              if duration >= MAX_DURATION_MINUTES:
                  return None

              flights = (
                  row.get("flights")
                  or []
              )

              if (
                  not isinstance(
                      flights,
                      list,
                  )
                  or len(flights)
                  not in (1, 2)
              ):
                  return None

              origin = airport_id(
                  flights[0].get(
                      "departure_airport"
                  )
              )

              destination = airport_id(
                  flights[-1].get(
                      "arrival_airport"
                  )
              )

              if (
                  origin not in LONDON_AIRPORTS
                  or destination != DESTINATION
              ):
                  return None

              # Reject airport-change connections.
              for (
                  current_leg,
                  next_leg,
              ) in zip(
                  flights,
                  flights[1:],
              ):
                  if (
                      airport_id(
                          current_leg.get(
                              "arrival_airport"
                          )
                      )
                      !=
                      airport_id(
                          next_leg.get(
                              "departure_airport"
                          )
                      )
                  ):
                      return None

              airlines = []
              numbers = []
              pinned_segments = []

              for leg in flights:
                  airline = str(
                      leg.get("airline")
                      or "Unknown"
                  ).strip()

                  if airline not in airlines:
                      airlines.append(
                          airline
                      )

                  number = str(
                      leg.get(
                          "flight_number"
                      )
                      or ""
                  ).strip()

                  if not number:
                      return None

                  numbers.append(
                      number
                  )

                  departure = (
                      leg.get(
                          "departure_airport"
                      )
                      or {}
                  )

                  arrival = (
                      leg.get(
                          "arrival_airport"
                      )
                      or {}
                  )

                  dep_id = airport_id(
                      departure
                  )

                  arr_id = airport_id(
                      arrival
                  )

                  dep_time = str(
                      departure.get("time")
                      or ""
                  ).strip()

                  if not dep_id or not arr_id:
                      return None

                  # SerpApi selected_flights_json
                  # expects flight numbers such as QR110.
                  pin_number = "".join(
                      number.split()
                  )

                  # Google normally returns departure
                  # times as YYYY-MM-DD HH:MM.
                  segment_date = (
                      dep_time[:10]
                      if len(dep_time) >= 10
                      else date
                  )

                  try:
                      datetime.strptime(
                          segment_date,
                          "%Y-%m-%d",
                      )
                  except ValueError:
                      return None

                  pinned_segments.append(
                      {
                          "flight_number":
                              pin_number,

                          "departure_id":
                              dep_id,

                          "arrival_id":
                              arr_id,

                          "date":
                              segment_date,
                      }
                  )

              selected_flights_json = (
                  json.dumps(
                      {
                          "outbound":
                              pinned_segments
                      },
                      separators=(",", ":"),
                  )
              )

              return {
                  "date":
                      date,

                  "origin_code":
                      origin,

                  "origin_name":
                      (
                          flights[0]
                          .get(
                              "departure_airport",
                              {},
                          )
                          .get("name")
                          or origin
                      ),

                  "destination":
                      DESTINATION,

                  "stops":
                      len(flights) - 1,

                  "airlines":
                      airlines,

                  "flight_numbers":
                      numbers,

                  "duration":
                      duration,

                  "shopping_price":
                      shopping_price,

                  "booking_token":
                      row.get(
                          "booking_token"
                      ),

                  "selected_flights_json":
                      selected_flights_json,

                  "search_url":
                      search_url,
              }


          def booking_price_gbp(together):
              for local in (
                  together.get(
                      "local_prices"
                  )
                  or []
              ):
                  if (
                      isinstance(
                          local,
                          dict,
                      )
                      and str(
                          local.get(
                              "currency"
                          )
                          or ""
                      ).upper()
                      == "GBP"
                  ):
                      value = as_price(
                          local.get(
                              "price"
                          )
                      )

                      if value is not None:
                          return value

              return as_price(
                  together.get(
                      "price"
                  )
              )


          def verify_booking(candidate):
              selected_json = candidate.get(
                  "selected_flights_json"
              )

              token = candidate.get(
                  "booking_token"
              )

              data = None
              primary_error = None

              # Preferred method:
              # pin the precise itinerary.
              if selected_json:
                  try:
                      data = serpapi_request(
                          {
                              "engine":
                                  "google_flights",

                              "type":
                                  2,

                              "travel_class":
                                  1,

                              "adults":
                                  1,

                              "currency":
                                  "GBP",

                              "hl":
                                  "en",

                              "gl":
                                  "uk",

                              "selected_flights_json":
                                  selected_json,

                              "no_cache":
                                  "true",
                          },

                          (
                              "Selected-flight "
                              "booking verification "
                              f"{candidate['date']} "
                              f"£{candidate['shopping_price']:.0f}"
                          ),

                          attempts=2,
                      )

                  except Exception as exc:
                      primary_error = str(
                          exc
                      )

                      print(
                          "Selected-flight "
                          "verification failed; "
                          "trying booking-token "
                          "fallback: "
                          f"{primary_error}"
                      )

              # Fallback:
              # original Google booking token
              # plus the itinerary context.
              if data is None and token:
                  try:
                      data = serpapi_request(
                          {
                              "engine":
                                  "google_flights",

                              "departure_id":
                                  candidate[
                                      "origin_code"
                                  ],

                              "arrival_id":
                                  DESTINATION,

                              "outbound_date":
                                  candidate[
                                      "date"
                                  ],

                              "type":
                                  2,

                              "travel_class":
                                  1,

                              "adults":
                                  1,

                              "currency":
                                  "GBP",

                              "hl":
                                  "en",

                              "gl":
                                  "uk",

                              "booking_token":
                                  token,

                              "no_cache":
                                  "true",
                          },

                          (
                              "Booking-token "
                              "fallback "
                              f"{candidate['date']} "
                              f"£{candidate['shopping_price']:.0f}"
                          ),

                          attempts=2,
                      )

                  except Exception as exc:
                      fallback_error = str(
                          exc
                      )

                      raise RuntimeError(
                          "Both SerpApi booking-"
                          "verification methods "
                          "failed. "
                          "selected_flights_json: "
                          f"{primary_error or 'not available'}"
                          " | booking_token: "
                          f"{fallback_error}"
                      ) from exc

              if data is None:
                  raise RuntimeError(
                      "Qualifying result had "
                      "neither a usable selected "
                      "itinerary nor booking token."
                  )

              options = data.get(
                  "booking_options"
              )

              if (
                  not isinstance(
                      options,
                      list,
                  )
                  or not options
              ):
                  raise RuntimeError(
                      "SerpApi returned no "
                      "booking_options for the "
                      "selected itinerary."
                  )

              usable = []
              all_separate = True

              for option in options:
                  if not isinstance(
                      option,
                      dict,
                  ):
                      continue

                  # Reject self-transfer /
                  # separate-ticket options.
                  if (
                      option.get(
                          "separate_tickets"
                      )
                      is True
                  ):
                      continue

                  all_separate = False

                  together = option.get(
                      "together"
                  )

                  if not isinstance(
                      together,
                      dict,
                  ):
                      continue

                  price = booking_price_gbp(
                      together
                  )

                  seller = str(
                      together.get(
                          "book_with"
                      )
                      or ""
                  ).strip()

                  if (
                      price is None
                      or not seller
                  ):
                      continue

                  usable.append(
                      {
                          "price":
                              price,

                          "seller":
                              seller,

                          "seller_type":
                              (
                                  "Airline direct"
                                  if together.get(
                                      "airline"
                                  )
                                  is True
                                  else
                                  "OTA / travel agent"
                              ),

                          "marketed_as":
                              together.get(
                                  "marketed_as"
                              )
                              or [],
                      }
                  )

              if not usable:
                  if all_separate:
                      print(
                          "Rejected: booking "
                          "options are "
                          "separate-ticket/"
                          "self-transfer only."
                      )

                      return None

                  raise RuntimeError(
                      "Booking options existed "
                      "but no priced non-separate "
                      "option could be parsed "
                      "safely."
                  )

              usable.sort(
                  key=lambda item:
                  item["price"]
              )

              option = usable[0]

              result = dict(
                  candidate
              )

              result.update(
                  {
                      "price":
                          round(
                              float(
                                  option[
                                      "price"
                                  ]
                              ),
                              2,
                          ),

                      "seller":
                          option[
                              "seller"
                          ],

                      "seller_type":
                          option[
                              "seller_type"
                          ],

                      "marketed_as":
                          option[
                              "marketed_as"
                          ],

                      "single_ticket_verified":
                          True,

                      "search_url":
                          normalise_url(
                              data.get(
                                  "search_metadata",
                                  {},
                              ).get(
                                  "google_flights_url"
                              )
                              or candidate[
                                  "search_url"
                              ]
                          ),
                  }
              )

              return result


          def search_date(date):
              print("")
              print(
                  "=================================="
              )
              print(
                  f"SERPAPI DEEP SEARCH {date}"
              )
              print(
                  "=================================="
              )

              data = serpapi_request(
                  {
                      "engine":
                          "google_flights",

                      "departure_id":
                          DEPARTURE_ID,

                      "arrival_id":
                          DESTINATION,

                      "outbound_date":
                          date,

                      "type":
                          2,

                      "travel_class":
                          1,

                      "adults":
                          1,

                      "currency":
                          "GBP",

                      "hl":
                          "en",

                      "gl":
                          "uk",

                      # 1 stop or fewer.
                      "stops":
                          2,

                      # Strictly under 25h.
                      "max_duration":
                          1499,

                      # Cheapest first.
                      "sort_by":
                          2,

                      "show_hidden":
                          "true",

                      "deep_search":
                          "true",

                      # Force fresh live search.
                      "no_cache":
                          "true",
                  },

                  f"Deep search {date}",
              )

              search_url = normalise_url(
                  data.get(
                      "search_metadata",
                      {},
                  ).get(
                      "google_flights_url"
                  )
                  or FALLBACK_URL
              )

              rows = []

              for key in (
                  "best_flights",
                  "other_flights",
              ):
                  if isinstance(
                      data.get(key),
                      list,
                  ):
                      rows.extend(
                          data[key]
                      )

              candidates = []
              seen = set()

              for row in rows:
                  candidate = parse_candidate(
                      row,
                      date,
                      search_url,
                  )

                  if candidate is None:
                      continue

                  dedupe = (
                      candidate.get(
                          "selected_flights_json"
                      )
                      or
                      candidate.get(
                          "booking_token"
                      )
                      or (
                          candidate[
                              "date"
                          ],
                          tuple(
                              candidate[
                                  "flight_numbers"
                              ]
                          ),
                          candidate[
                              "shopping_price"
                          ],
                          candidate[
                              "duration"
                          ],
                      )
                  )

                  if dedupe in seen:
                      continue

                  seen.add(
                      dedupe
                  )

                  candidates.append(
                      candidate
                  )

              candidates.sort(
                  key=lambda item:
                  item[
                      "shopping_price"
                  ]
              )

              print(
                  "Deep-search rows: "
                  f"{len(rows)} | "
                  "eligible after filters: "
                  f"{len(candidates)}"
              )

              if not candidates:
                  return None

              best_verified = None

              for candidate in candidates:
                  if (
                      best_verified
                      is not None
                      and candidate[
                          "shopping_price"
                      ]
                      >= best_verified[
                          "price"
                      ]
                      - 0.01
                  ):
                      break

                  print(
                      "Verifying "
                      f"{candidate['origin_code']} "
                      "→ PER "
                      f"{candidate['date']} | "
                      "shopping "
                      f"£{candidate['shopping_price']:.0f} "
                      "| "
                      f"{format_duration(candidate['duration'])}"
                  )

                  verified = verify_booking(
                      candidate
                  )

                  if verified is None:
                      continue

                  print(
                      "VERIFIED SINGLE TICKET: "
                      f"£{verified['price']:.0f} | "
                      f"{verified['seller']} | "
                      f"{verified['seller_type']}"
                  )

                  if (
                      best_verified
                      is None
                      or verified["price"]
                      <
                      best_verified["price"]
                  ):
                      best_verified = (
                          verified
                      )

              if best_verified is None:
                  print(
                      "No qualifying "
                      "non-separate-ticket "
                      "booking option for "
                      "this date."
                  )

              return best_verified


          def default_state():
              return {
                  "filter_signature":
                      FILTER_SIGNATURE,

                  "initial_test_sent":
                      False,

                  "serpapi_test_sent":
                      False,

                  "baseline_pending":
                      False,

                  "lowest_price":
                      None,

                  "record_best":
                      None,

                  "last_seen_price":
                      None,

                  "last_best":
                      None,

                  "availability_missing":
                      False,
              }


          def load_state():
              if not STATE_FILE.exists():
                  return default_state()

              stored = json.loads(
                  STATE_FILE.read_text(
                      encoding="utf-8"
                  )
              )

              if (
                  stored.get(
                      "filter_signature"
                  )
                  != FILTER_SIGNATURE
              ):
                  print(
                      "Switching to SerpApi "
                      "verified pricing; "
                      "resetting old price "
                      "baseline once."
                  )

                  state = default_state()

                  state[
                      "initial_test_sent"
                  ] = bool(
                      stored.get(
                          "initial_test_sent",
                          False,
                      )
                  )

                  # Force one new SerpApi TEST.
                  state[
                      "serpapi_test_sent"
                  ] = False

                  state[
                      "baseline_pending"
                  ] = True

                  return state

              state = default_state()

              state.update(
                  stored
              )

              return state


          def state_best(best):
              if not isinstance(
                  best,
                  dict,
              ):
                  return None

              keys = [
                  "price",
                  "shopping_price",
                  "date",
                  "origin_code",
                  "origin_name",
                  "destination",
                  "stops",
                  "airlines",
                  "flight_numbers",
                  "duration",
                  "seller",
                  "seller_type",
                  "marketed_as",
                  "single_ticket_verified",
                  "search_url",
              ]

              return {
                  key: best.get(key)
                  for key in keys
                  if key in best
              }


          def save_state(state):
              state[
                  "filter_signature"
              ] = FILTER_SIGNATURE

              STATE_FILE.write_text(
                  json.dumps(
                      state,
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )


          def flight_details(best):
              stops_text = (
                  "Direct"
                  if best["stops"] == 0
                  else "1 stop"
              )

              lines = [
                  "London → Perth",

                  (
                      "One way: "
                      f"{format_date(best['date'])}"
                  ),

                  (
                      f"From: {best['origin_code']} "
                      f"({best['origin_name']})"
                  ),

                  (
                      "Verified booking price: "
                      f"£{float(best['price']):.0f}"
                  ),

                  (
                      f"Stops: "
                      f"{stops_text}"
                  ),

                  (
                      "Duration: "
                      f"{format_duration(best['duration'])}"
                  ),

                  (
                      "Airlines: "
                      f"{', '.join(best['airlines'])}"
                  ),

                  (
                      "Flights: "
                      f"{', '.join(best['flight_numbers'])}"
                  ),

                  (
                      "Book with: "
                      f"{best['seller']}"
                  ),

                  (
                      "Seller type: "
                      f"{best['seller_type']}"
                  ),

                  (
                      "Single ticket / "
                      "no self-transfer: YES ✅"
                  ),

                  (
                      "Airport-change "
                      "connection: NO ✅"
                  ),

                  (
                      "Maximum journey: "
                      "under 25h"
                  ),

                  (
                      "Source: SerpApi "
                      "Google Flights deep search "
                      "+ booking options"
                  ),
              ]

              if (
                  abs(
                      float(
                          best[
                              "shopping_price"
                          ]
                      )
                      -
                      float(
                          best[
                              "price"
                          ]
                      )
                  )
                  > 0.01
              ):
                  lines.append(
                      "Google shopping price: "
                      f"£{float(best['shopping_price']):.0f}; "
                      "verified seller price: "
                      f"£{float(best['price']):.0f}"
                  )

              return "\n".join(
                  lines
              )


          def previous_details(best):
              if not isinstance(
                  best,
                  dict,
              ):
                  return ""

              date_text = (
                  format_date(
                      best["date"]
                  )
                  if best.get(
                      "date"
                  )
                  else "Unknown date"
              )

              origin = best.get(
                  "origin_code",
                  "London",
              )

              airlines = (
                  ", ".join(
                      best.get(
                          "airlines"
                      )
                      or []
                  )
                  or "Unknown airline"
              )

              duration_text = (
                  ", "
                  + format_duration(
                      best[
                          "duration"
                      ]
                  )
                  if best.get(
                      "duration"
                  )
                  is not None
                  else ""
              )

              seller_text = (
                  f", seller: "
                  f"{best['seller']}"
                  if best.get(
                      "seller"
                  )
                  else ""
              )

              return (
                  "Previous itinerary: "
                  f"{date_text}, "
                  f"{origin} → PER, "
                  f"{airlines}"
                  f"{duration_text}"
                  f"{seller_text}"
              )


          # ============================================================
          # SEARCH ALL FOUR DATES
          # ============================================================

          candidates = []
          successful_searches = 0

          for date in DATES:
              try:
                  result = search_date(
                      date
                  )

                  successful_searches += 1

                  if result is not None:
                      candidates.append(
                          result
                      )

              except Exception as exc:
                  print(
                      "Search/verification "
                      f"failed for {date}: "
                      f"{exc}"
                  )

              time.sleep(2)


          # ============================================================
          # SAFETY CHECK
          #
          # Never alter tracker state if any one of
          # the four searches/booking verifications fails.
          # ============================================================

          if (
              successful_searches
              != len(DATES)
          ):
              raise RuntimeError(
                  f"Only {successful_searches}/"
                  f"{len(DATES)} dates completed "
                  "deep search AND booking "
                  "verification. "
                  "Tracker state was NOT changed."
              )


          state = load_state()


          # ============================================================
          # NO VERIFIED MATCH
          # ============================================================

          if not candidates:
              print(
                  "No qualifying verified "
                  "single-ticket fare is showing."
              )

              # Fresh one-time SerpApi TEST.
              if not state.get(
                  "serpapi_test_sent",
                  False,
              ):
                  send_notification(
                      "✅ TEST — Flight tracker is LIVE",

                      (
                          "SerpApi Google Flights "
                          "tracker is running "
                          "successfully.\n\n"

                          "London → Perth\n"
                          "Dates: 10–13 Jan 2027\n"
                          "One way · Economy\n"
                          "London airports: "
                          "LHR, LGW, STN, LTN, LCY, SEN\n"
                          "Maximum 1 stop\n"
                          "Strictly under 25 hours\n"
                          "Single-ticket / "
                          "no self-transfer only\n"
                          "Airport-change connections "
                          "excluded\n"
                          "Airline direct + ALL "
                          "Google Flights OTAs allowed\n"
                          "GBP · UK Google Flights locale\n"
                          "Source: SerpApi Google Flights "
                          "deep search + booking options\n\n"

                          "No qualifying verified fare "
                          "is currently showing."
                      ),

                      priority=3,

                      tags=[
                          "white_check_mark",
                          "airplane",
                      ],

                      click_url=FALLBACK_URL,
                  )

                  state[
                      "serpapi_test_sent"
                  ] = True

                  state[
                      "initial_test_sent"
                  ] = True

                  state[
                      "baseline_pending"
                  ] = False

                  print(
                      "FIRST SERPAPI TEST "
                      "NOTIFICATION SENT"
                  )

              elif state.get(
                  "baseline_pending",
                  False,
              ):
                  print(
                      "SerpApi baseline "
                      "established with no "
                      "qualifying fare. "
                      "No migration alert sent."
                  )

                  state[
                      "baseline_pending"
                  ] = False

              elif not state.get(
                  "availability_missing",
                  False,
              ):
                  previous_price = (
                      state.get(
                          "last_seen_price"
                      )
                  )

                  message = (
                      "No qualifying verified "
                      "single-ticket London → Perth "
                      "fare is currently showing."
                  )

                  if (
                      previous_price
                      is not None
                  ):
                      message += (
                          "\n\nPrevious cheapest: "
                          f"£{float(previous_price):.0f}"
                      )

                  old_description = (
                      previous_details(
                          state.get(
                              "last_best"
                          )
                      )
                  )

                  if old_description:
                      message += (
                          "\n"
                          + old_description
                      )

                  send_notification(
                      "⚠️ CHEAPER FARE DISAPPEARED",

                      message,

                      priority=(
                          priority_for_price(
                              previous_price
                          )
                          if previous_price
                          is not None
                          else 3
                      ),

                      tags=[
                          "warning",
                          "airplane",
                      ],

                      click_url=FALLBACK_URL,
                  )

              state[
                  "availability_missing"
              ] = True

              state[
                  "last_seen_price"
              ] = None

              state[
                  "last_best"
              ] = None

              save_state(
                  state
              )


          # ============================================================
          # VERIFIED FARES EXIST
          # ============================================================

          else:
              candidates.sort(
                  key=lambda item:
                  float(
                      item["price"]
                  )
              )

              # Cheapest verified airline/OTA
              # across ALL FOUR dates.
              best = candidates[0]

              current_price = float(
                  best["price"]
              )

              old_lowest = state.get(
                  "lowest_price"
              )

              previous_price = state.get(
                  "last_seen_price"
              )

              old_best = state.get(
                  "last_best"
              )

              was_missing = bool(
                  state.get(
                      "availability_missing",
                      False,
                  )
              )

              baseline_pending = bool(
                  state.get(
                      "baseline_pending",
                      False,
                  )
              )

              print("")
              print(
                  "=================================="
              )
              print(
                  "CURRENT CHEAPEST VERIFIED FARE"
              )
              print(
                  "=================================="
              )
              print(
                  flight_details(
                      best
                  )
              )


              # ========================================================
              # ONE-TIME FRESH SERPAPI TEST
              # ========================================================

              if not state.get(
                  "serpapi_test_sent",
                  False,
              ):
                  send_notification(
                      "✅ TEST — Flight tracker is LIVE",

                      (
                          "SerpApi Google Flights "
                          "tracker is running "
                          "successfully.\n\n"

                          + flight_details(
                              best
                          )

                          + "\n\n"

                          "Tracking all Google Flights "
                          "airline-direct + OTA "
                          "booking options.\n"

                          "This SerpApi TEST "
                          "notification will not "
                          "be sent again."
                      ),

                      priority=3,

                      tags=[
                          "white_check_mark",
                          "airplane",
                      ],

                      click_url=best[
                          "search_url"
                      ],
                  )

                  state[
                      "serpapi_test_sent"
                  ] = True

                  state[
                      "initial_test_sent"
                  ] = True

                  state[
                      "baseline_pending"
                  ] = False

                  state[
                      "lowest_price"
                  ] = current_price

                  state[
                      "record_best"
                  ] = state_best(
                      best
                  )

                  print(
                      "FIRST SERPAPI TEST "
                      "NOTIFICATION SENT"
                  )

                  print(
                      "Fresh SerpApi baseline "
                      "established at "
                      f"£{current_price:.0f}."
                  )


              # ========================================================
              # MIGRATION BASELINE
              # ========================================================

              elif baseline_pending:
                  state[
                      "baseline_pending"
                  ] = False

                  state[
                      "lowest_price"
                  ] = current_price

                  state[
                      "record_best"
                  ] = state_best(
                      best
                  )

                  print(
                      "Fresh SerpApi baseline "
                      "established at "
                      f"£{current_price:.0f}. "
                      "No migration alert sent."
                  )


              # ========================================================
              # NEW ALL-TIME LOW
              # ========================================================

              elif (
                  old_lowest is None
                  or current_price
                  <
                  float(
                      old_lowest
                  )
                  - 0.01
              ):
                  previous_record = (
                      float(
                          old_lowest
                      )
                      if old_lowest
                      is not None
                      else None
                  )

                  if (
                      current_price
                      < URGENT_PRICE
                  ):
                      title = (
                          "🚨 PERTH FLIGHT "
                          "UNDER £700"
                      )

                      priority = 5

                      tags = [
                          "rotating_light",
                          "fire",
                          "airplane",
                      ]

                  elif (
                      current_price
                      < HIGH_PRIORITY_PRICE
                  ):
                      title = (
                          "🔥 PERTH FLIGHT "
                          "UNDER £750"
                      )

                      priority = 4

                      tags = [
                          "fire",
                          "airplane",
                          "chart_with_downwards_trend",
                      ]

                  else:
                      title = (
                          "✈️ NEW LOWEST "
                          "PERTH FARE"
                      )

                      priority = 3

                      tags = [
                          "airplane",
                          "chart_with_downwards_trend",
                      ]

                  message = flight_details(
                      best
                  )

                  if (
                      previous_record
                      is not None
                  ):
                      message += (
                          "\n\nPrevious record: "
                          f"£{previous_record:.0f}"

                          "\nNEW RECORD: "
                          f"£{current_price:.0f}"

                          "\nDrop: "
                          f"£{previous_record - current_price:.0f}"
                      )

                  send_notification(
                      title,
                      message,
                      priority,
                      tags,
                      best["search_url"],
                  )

                  state[
                      "lowest_price"
                  ] = current_price

                  state[
                      "record_best"
                  ] = state_best(
                      best
                  )

                  print(
                      "NEW ALL-TIME LOW "
                      "ALERT SENT"
                  )


              # ========================================================
              # PRICE INCREASE
              # ========================================================

              elif (
                  previous_price
                  is not None
                  and current_price
                  >
                  float(
                      previous_price
                  )
                  + 0.01
              ):
                  old_price = float(
                      previous_price
                  )

                  message = (
                      "The previous cheapest "
                      "verified fare is no longer "
                      "showing at that price."

                      "\n\nWas: "
                      f"£{old_price:.0f}"

                      "\nCheapest now: "
                      f"£{current_price:.0f}"

                      "\nIncrease: "
                      f"£{current_price - old_price:.0f}"
                  )

                  old_description = (
                      previous_details(
                          old_best
                      )
                  )

                  if old_description:
                      message += (
                          "\n\n"
                          + old_description
                      )

                  message += (
                      "\n\nCurrent cheapest:\n"
                      + flight_details(
                          best
                      )
                  )

                  send_notification(
                      "⚠️ CHEAPER FARE DISAPPEARED",

                      message,

                      priority_for_price(
                          old_price
                      ),

                      [
                          "warning",
                          "airplane",
                          "chart_with_upwards_trend",
                      ],

                      best[
                          "search_url"
                      ],
                  )

                  print(
                      "PRICE-RISE ALERT SENT"
                  )


              # ========================================================
              # CHEAPER AGAIN BUT NOT NEW RECORD
              # ========================================================

              elif (
                  previous_price
                  is not None
                  and current_price
                  <
                  float(
                      previous_price
                  )
                  - 0.01
              ):
                  old_price = float(
                      previous_price
                  )

                  if (
                      old_lowest
                      is not None
                      and abs(
                          current_price
                          -
                          float(
                              old_lowest
                          )
                      )
                      <= 0.01
                  ):
                      title = (
                          "✈️ BEST FARE IS BACK"
                      )

                  elif (
                      current_price
                      < URGENT_PRICE
                  ):
                      title = (
                          "🚨 FARE GOT CHEAPER — "
                          "UNDER £700"
                      )

                  elif (
                      current_price
                      < HIGH_PRIORITY_PRICE
                  ):
                      title = (
                          "🔥 FARE GOT CHEAPER — "
                          "UNDER £750"
                      )

                  else:
                      title = (
                          "✈️ FARE GOT CHEAPER AGAIN"
                      )

                  message = (
                      flight_details(
                          best
                      )

                      + "\n\nWas: "
                      f"£{old_price:.0f}"

                      + "\nNow: "
                      f"£{current_price:.0f}"

                      + "\nDrop: "
                      f"£{old_price - current_price:.0f}"
                  )

                  if (
                      old_lowest
                      is not None
                  ):
                      message += (
                          "\nAll-time record: "
                          f"£{float(old_lowest):.0f}"
                      )

                  send_notification(
                      title,

                      message,

                      priority_for_price(
                          current_price
                      ),

                      [
                          "airplane",
                          "chart_with_downwards_trend",
                      ],

                      best[
                          "search_url"
                      ],
                  )

                  print(
                      "CHEAPER-AGAIN "
                      "ALERT SENT"
                  )


              # ========================================================
              # FARES RETURNED
              # ========================================================

              elif was_missing:
                  send_notification(
                      "✈️ MATCHING FARES ARE BACK",

                      (
                          "A qualifying verified "
                          "single-ticket fare is "
                          "showing again.\n\n"

                          + flight_details(
                              best
                          )
                      ),

                      priority_for_price(
                          current_price
                      ),

                      [
                          "airplane",
                          "white_check_mark",
                      ],

                      best[
                          "search_url"
                      ],
                  )

                  print(
                      "FARES-RETURNED "
                      "ALERT SENT"
                  )


              # ========================================================
              # NO CHANGE
              # ========================================================

              else:
                  print(
                      "No alert needed. "
                      "Current cheapest verified: "
                      f"£{current_price:.0f} "
                      f"with {best['seller']}"
                  )

                  if (
                      old_lowest
                      is not None
                  ):
                      print(
                          "All-time verified record: "
                          f"£{float(old_lowest):.0f}"
                      )


              # ========================================================
              # SAVE CURRENT CHEAPEST
              # ========================================================

              state[
                  "availability_missing"
              ] = False

              state[
                  "last_seen_price"
              ] = current_price

              state[
                  "last_best"
              ] = state_best(
                  best
              )

              save_state(
                  state
              )

          PY

      - name: Save tracker state
        run: |
          if [ -z "$(git status --porcelain -- .flight-alert-state.json)" ]; then
            echo "No tracker-state change to save."
            exit 0
          fi

          git config user.name "flight-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .flight-alert-state.json

          git commit -m "Update flight tracker state [skip ci]"

          git pull --rebase origin master

          git push origin HEAD:master
