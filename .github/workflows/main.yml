name: Perth Flight Price Alerts

on:
  workflow_dispatch:
  schedule:
    # Check approximately every 5 minutes
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: perth-flight-price-tracker
  cancel-in-progress: false

jobs:
  check-flights:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Flights library
        run: |
          python -m pip install --upgrade pip
          pip install "flights==0.9.0"

      - name: Check London to Perth fares
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          from fli.models import (
              Airport,
              FlightSearchFilters,
              FlightSegment,
              MaxStops,
              PassengerInfo,
              SeatType,
              SortBy,
              TripType,
          )
          from fli.search import SearchFlights


          # ============================================================
          # TRACKER SETTINGS
          # ============================================================

          DATES = [
              "2027-01-10",
              "2027-01-11",
              "2027-01-12",
              "2027-01-13",
          ]

          LONDON_AIRPORTS = [
              Airport.LHR,
              Airport.LGW,
              Airport.STN,
              Airport.LTN,
              Airport.LCY,
              Airport.SEN,
          ]

          DESTINATION = Airport.PER

          # HIGH priority BELOW £750
          HIGH_PRIORITY_PRICE = 750

          # URGENT priority BELOW £700
          URGENT_PRICE = 700

          STATE_FILE = Path(".flight-alert-state.json")

          NTFY_TOPIC = os.environ.get(
              "NTFY_TOPIC",
              "",
          ).strip()

          GOOGLE_FLIGHTS_URL = (
              "https://www.google.com/travel/flights"
              "?hl=en-GB&curr=GBP&gl=GB"
          )

          if not NTFY_TOPIC:
              raise RuntimeError(
                  "NTFY_TOPIC is missing. "
                  "Add it under Settings > Secrets and variables > Actions."
              )


          # ============================================================
          # NTFY NOTIFICATIONS
          # ============================================================

          def send_notification(
              title,
              message,
              priority=3,
              tags=None,
          ):
              if tags is None:
                  tags = ["airplane"]

              payload = {
                  "topic": NTFY_TOPIC,
                  "title": title,
                  "message": message,
                  "priority": int(priority),
                  "tags": tags,
                  "click": GOOGLE_FLIGHTS_URL,
              }

              request = urllib.request.Request(
                  "https://ntfy.sh",
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  request,
                  timeout=20,
              ) as response:
                  print(
                      "ntfy notification sent: "
                      f"{response.status} {title}"
                  )


          # ============================================================
          # DISPLAY HELPERS
          # ============================================================

          def enum_code(value):
              if value is None:
                  return "Unknown"

              name = getattr(
                  value,
                  "name",
                  None,
              )

              if name:
                  return str(name).removeprefix("_")

              return str(value)


          def enum_label(value):
              if value is None:
                  return "Unknown"

              label = getattr(
                  value,
                  "value",
                  None,
              )

              if label is not None:
                  return str(label)

              return enum_code(value)


          def format_duration(minutes):
              minutes = int(minutes)

              hours = minutes // 60
              mins = minutes % 60

              return f"{hours}h {mins:02d}m"


          def format_date(date_string):
              return datetime.strptime(
                  date_string,
                  "%Y-%m-%d",
              ).strftime(
                  "%d %b %Y"
              )


          def priority_for_price(price):
              price = float(price)

              if price < URGENT_PRICE:
                  return 5

              if price < HIGH_PRIORITY_PRICE:
                  return 4

              return 3


          # ============================================================
          # CONNECTION / TRANSFER SAFETY
          # ============================================================

          def has_airport_change(flight):

              # Google's parsed layover information
              for layover in flight.layovers or []:

                  if getattr(
                      layover,
                      "change_of_airport",
                      False,
                  ):
                      return True

              # Extra structural safety check
              for current_leg, next_leg in zip(
                  flight.legs,
                  flight.legs[1:],
              ):

                  if (
                      current_leg.arrival_airport
                      != next_leg.departure_airport
                  ):
                      return True

              return False


          # ============================================================
          # FLIGHT DESCRIPTION
          # ============================================================

          def describe_flight(
              flight,
              date,
          ):

              if not flight.legs:
                  raise ValueError(
                      "Flight result contains no legs."
                  )

              first_leg = flight.legs[0]

              airlines = []
              flight_numbers = []

              for leg in flight.legs:

                  airline_name = enum_label(
                      leg.airline
                  )

                  airline_code = enum_code(
                      leg.airline
                  )

                  if airline_name not in airlines:
                      airlines.append(
                          airline_name
                      )

                  number = str(
                      leg.flight_number or ""
                  ).strip()

                  if number:

                      if number.upper().startswith(
                          airline_code.upper()
                      ):
                          display_number = number

                      else:
                          display_number = (
                              f"{airline_code}{number}"
                          )

                      flight_numbers.append(
                          display_number
                      )

              return {
                  "price": round(
                      float(flight.price),
                      2,
                  ),
                  "date": date,
                  "origin_code": enum_code(
                      first_leg.departure_airport
                  ),
                  "origin_name": enum_label(
                      first_leg.departure_airport
                  ),
                  "destination": "PER",
                  "stops": int(
                      flight.stops
                  ),
                  "airlines": airlines,
                  "flight_numbers": flight_numbers,
                  "duration": int(
                      flight.duration
                  ),
              }


          def flight_details(best):

              if best["stops"] == 0:
                  stops_text = "Direct"
              else:
                  stops_text = "1 stop"

              return (
                  "London → Perth\n"
                  f"One way: {format_date(best['date'])}\n"
                  f"From: {best['origin_code']} "
                  f"({best['origin_name']})\n"
                  f"Price: £{float(best['price']):.0f}\n"
                  f"Stops: {stops_text}\n"
                  f"Duration: "
                  f"{format_duration(best['duration'])}\n"
                  f"Airlines: "
                  f"{', '.join(best['airlines'])}\n"
                  f"Flights: "
                  f"{', '.join(best['flight_numbers'])}\n"
                  "Explicit self-transfer itineraries excluded"
              )


          def previous_details(best):

              if not isinstance(
                  best,
                  dict,
              ):
                  return ""

              date = best.get(
                  "date"
              )

              if date:
                  date_text = format_date(
                      date
                  )
              else:
                  date_text = "Unknown date"

              origin = best.get(
                  "origin_code",
                  "London",
              )

              airlines = ", ".join(
                  best.get("airlines") or []
              )

              if not airlines:
                  airlines = "Unknown airline"

              stops = best.get(
                  "stops"
              )

              if stops == 0:
                  stops_text = "Direct"
              elif stops == 1:
                  stops_text = "1 stop"
              else:
                  stops_text = "Unknown stops"

              return (
                  f"Previous itinerary: "
                  f"{date_text}, "
                  f"{origin} → PER, "
                  f"{stops_text}, "
                  f"{airlines}"
              )


          # ============================================================
          # SAVED STATE
          # ============================================================

          def default_state():

              return {
                  "initial_test_sent": False,
                  "lowest_price": None,
                  "record_best": None,
                  "last_seen_price": None,
                  "last_best": None,
                  "availability_missing": False,
              }


          def load_state():

              if not STATE_FILE.exists():
                  return default_state()

              try:

                  stored = json.loads(
                      STATE_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  state = default_state()

                  state.update(
                      stored
                  )

                  # Compatibility with older tracker state
                  if (
                      state.get("record_best")
                      is None
                      and isinstance(
                          stored.get("best"),
                          dict,
                      )
                  ):
                      state["record_best"] = (
                          stored["best"]
                      )

                  if (
                      state.get("last_best")
                      is None
                      and isinstance(
                          stored.get("best"),
                          dict,
                      )
                  ):
                      state["last_best"] = (
                          stored["best"]
                      )

                  if (
                      state.get("last_seen_price")
                      is None
                      and stored.get(
                          "lowest_price"
                      )
                      is not None
                  ):
                      state["last_seen_price"] = (
                          stored["lowest_price"]
                      )

                  return state

              except Exception as exc:

                  print(
                      "Could not load tracker state: "
                      f"{exc}"
                  )

                  return default_state()


          def save_state(state):

              STATE_FILE.write_text(
                  json.dumps(
                      state,
                      indent=2,
                      sort_keys=True,
                  )
                  + "\n",
                  encoding="utf-8",
              )


          # ============================================================
          # GOOGLE FLIGHTS SEARCH
          # ============================================================

          def search_date(date):

              filters = FlightSearchFilters(

                  trip_type=TripType.ONE_WAY,

                  passenger_info=PassengerInfo(
                      adults=1
                  ),

                  flight_segments=[
                      FlightSegment(

                          departure_airport=[
                              [airport, 0]
                              for airport
                              in LONDON_AIRPORTS
                          ],

                          arrival_airport=[
                              [DESTINATION, 0]
                          ],

                          travel_date=date,
                      )
                  ],

                  seat_type=SeatType.ECONOMY,

                  # Maximum ONE stop
                  stops=MaxStops.ONE_STOP_OR_FEWER,

                  sort_by=SortBy.CHEAPEST,

                  show_all_results=True,
              )


              search = SearchFlights()


              flights = search.search(
                  filters,
                  currency="GBP",
                  language="en-GB",
                  country="GB",
              ) or []


              print(
                  f"Google returned "
                  f"{len(flights)} result(s)."
              )


              valid = []

              no_price = 0
              too_many_stops = 0
              self_transfer = 0
              airport_change = 0
              wrong_currency = 0


              for flight in flights:

                  # Ignore results where Google hasn't supplied
                  # an actual usable price.
                  if flight.price is None:

                      no_price += 1

                      continue


                  # HARD LIMIT: max 1 stop.
                  if int(
                      flight.stops
                  ) > 1:

                      too_many_stops += 1

                      continue


                  # Reject anything Google explicitly identifies
                  # as a self-transfer / separate-ticket itinerary.
                  if getattr(
                      flight,
                      "self_transfer",
                      None,
                  ) is True:

                      self_transfer += 1

                      continue


                  # Reject airport changes during connections.
                  if has_airport_change(
                      flight
                  ):

                      airport_change += 1

                      continue


                  # We requested GBP.
                  currency = getattr(
                      flight,
                      "currency",
                      None,
                  )

                  if (
                      currency
                      and str(
                          currency
                      ).upper()
                      != "GBP"
                  ):

                      wrong_currency += 1

                      continue


                  valid.append(
                      flight
                  )


              print(
                  f"Accepted: {len(valid)} | "
                  f"No price: {no_price} | "
                  f"Self-transfer rejected: "
                  f"{self_transfer} | "
                  f"Airport-change rejected: "
                  f"{airport_change} | "
                  f">1 stop rejected: "
                  f"{too_many_stops} | "
                  f"Wrong currency: "
                  f"{wrong_currency}"
              )


              return valid


          # ============================================================
          # SEARCH ALL FOUR DAYS
          # ============================================================

          candidates = []

          successful_searches = 0


          for date in DATES:

              print("")
              print(
                  "=================================="
              )

              print(
                  f"Searching London -> Perth "
                  f"on {date}"
              )

              print(
                  "=================================="
              )


              try:

                  flights = search_date(
                      date
                  )

                  successful_searches += 1


                  for flight in flights:

                      try:

                          candidate = describe_flight(
                              flight,
                              date,
                          )

                          candidates.append(
                              candidate
                          )

                      except Exception as exc:

                          print(
                              "Skipping invalid "
                              f"flight result: {exc}"
                          )


              except Exception as exc:

                  print(
                      f"Search failed for "
                      f"{date}: {exc}"
                  )


              # Small delay between Google requests
              time.sleep(2)


          # ============================================================
          # IMPORTANT SAFETY CHECK
          #
          # Don't send "fare disappeared" notifications if Google failed
          # to search one of the dates.
          # ============================================================

          if successful_searches != len(
              DATES
          ):

              raise RuntimeError(
                  f"Only {successful_searches}/"
                  f"{len(DATES)} date searches "
                  "completed successfully. "
                  "Tracker state was NOT changed, "
                  "preventing a false disappearance alert."
              )


          state = load_state()


          # ============================================================
          # NO VALID MATCHING FARES
          # ============================================================

          if not candidates:

              print(
                  "No valid matching fares "
                  "are currently showing."
              )


              # FIRST RUN TEST ONLY
              if not state.get(
                  "initial_test_sent",
                  False,
              ):

                  send_notification(

                      "✅ TEST — Flight tracker is LIVE",

                      (
                          "The automated tracker "
                          "is running successfully.\n\n"
                          "London → Perth\n"
                          "One way: 10–13 Jan 2027\n"
                          "Economy\n"
                          "Maximum 1 stop\n"
                          "Self-transfer results excluded\n\n"
                          "No matching fare is "
                          "currently showing.\n\n"
                          "This test notification "
                          "will not be sent again."
                      ),

                      priority=3,

                      tags=[
                          "white_check_mark",
                          "airplane",
                      ],
                  )


                  state[
                      "initial_test_sent"
                  ] = True


              # A fare existed on the previous check,
              # but now NO matching fares exist.
              elif not state.get(
                  "availability_missing",
                  False,
              ):

                  previous_price = state.get(
                      "last_seen_price"
                  )

                  old_best = state.get(
                      "last_best"
                  )


                  message = (
                      "No valid London → Perth "
                      "fare matching your filters "
                      "is currently showing."
                  )


                  if previous_price is not None:

                      message += (
                          "\n\nPrevious cheapest: "
                          f"£{float(previous_price):.0f}"
                      )


                  old_description = (
                      previous_details(
                          old_best
                      )
                  )


                  if old_description:

                      message += (
                          "\n"
                          + old_description
                      )


                  send_notification(

                      "⚠️ CHEAPER FARE DISAPPEARED",

                      message,

                      priority=(
                          priority_for_price(
                              previous_price
                          )
                          if previous_price
                          is not None
                          else 3
                      ),

                      tags=[
                          "warning",
                          "airplane",
                      ],
                  )


              state[
                  "availability_missing"
              ] = True

              state[
                  "last_seen_price"
              ] = None

              state[
                  "last_best"
              ] = None


              save_state(
                  state
              )


          # ============================================================
          # WE HAVE VALID FARES
          # ============================================================

          else:

              candidates.sort(
                  key=lambda item:
                  item["price"]
              )


              best = candidates[0]

              current_price = float(
                  best["price"]
              )

              details = flight_details(
                  best
              )


              print("")
              print(
                  "=================================="
              )

              print(
                  "CURRENT CHEAPEST VALID FARE"
              )

              print(
                  "=================================="
              )

              print(
                  details
              )


              old_lowest = state.get(
                  "lowest_price"
              )

              previous_price = state.get(
                  "last_seen_price"
              )

              old_best = state.get(
                  "last_best"
              )

              was_missing = bool(
                  state.get(
                      "availability_missing",
                      False,
                  )
              )


              # ========================================================
              # FIRST SUCCESSFUL RUN ONLY
              # ========================================================

              if not state.get(
                  "initial_test_sent",
                  False,
              ):

                  send_notification(

                      "✅ TEST — Flight tracker is LIVE",

                      (
                          "The automated flight tracker "
                          "is running successfully.\n\n"
                          + details
                          + "\n\n"
                          "It checks approximately "
                          "every 5 minutes.\n\n"
                          "You will be alerted when:\n"
                          "• a new cheapest fare appears\n"
                          "• the cheapest fare gets cheaper\n"
                          "• a cheaper fare disappears / rises\n"
                          "• matching fares disappear\n"
                          "• matching fares return\n\n"
                          "High priority: under £750\n"
                          "URGENT: under £700\n\n"
                          "This test notification "
                          "will not be sent again."
                      ),

                      priority=3,

                      tags=[
                          "white_check_mark",
                          "airplane",
                      ],
                  )


                  state[
                      "initial_test_sent"
                  ] = True

                  state[
                      "lowest_price"
                  ] = current_price

                  state[
                      "record_best"
                  ] = best


                  print(
                      "FIRST-RUN TEST "
                      "NOTIFICATION SENT"
                  )

                  print(
                      "Initial record: "
                      f"£{current_price:.0f}"
                  )


              # ========================================================
              # NEW ALL-TIME LOW
              # ========================================================

              elif (
                  old_lowest is None
                  or current_price
                  < float(old_lowest) - 0.01
              ):

                  previous_record = (
                      float(old_lowest)
                      if old_lowest is not None
                      else None
                  )


                  if current_price < URGENT_PRICE:

                      title = (
                          "🚨 PERTH FLIGHT UNDER £700"
                      )

                      priority = 5

                      tags = [
                          "rotating_light",
                          "fire",
                          "airplane",
                      ]


                  elif current_price < HIGH_PRIORITY_PRICE:

                      title = (
                          "🔥 PERTH FLIGHT UNDER £750"
                      )

                      priority = 4

                      tags = [
                          "fire",
                          "airplane",
                          "chart_with_downwards_trend",
                      ]


                  else:

                      title = (
                          "✈️ NEW LOWEST PERTH FARE"
                      )

                      priority = 3

                      tags = [
                          "airplane",
                          "chart_with_downwards_trend",
                      ]


                  message = details


                  if previous_record is not None:

                      message += (

                          "\n\nPrevious record: "
                          f"£{previous_record:.0f}"

                          "\nNEW RECORD: "
                          f"£{current_price:.0f}"

                          "\nDrop: "
                          f"£{previous_record - current_price:.0f}"
                      )


                  send_notification(
                      title,
                      message,
                      priority=priority,
                      tags=tags,
                  )


                  state[
                      "lowest_price"
                  ] = current_price

                  state[
                      "record_best"
                  ] = best


                  print(
                      "NEW ALL-TIME LOW ALERT SENT"
                  )


              # ========================================================
              # PREVIOUS CHEAPER FARE DISAPPEARED / PRICE ROSE
              # ========================================================

              elif (
                  previous_price is not None
                  and current_price
                  > float(previous_price) + 0.01
              ):

                  old_price = float(
                      previous_price
                  )

                  increase = (
                      current_price
                      - old_price
                  )


                  message = (

                      "The previous cheapest valid fare "
                      "is no longer showing at that price."

                      "\n\nWas: "
                      f"£{old_price:.0f}"

                      "\nCheapest now: "
                      f"£{current_price:.0f}"

                      "\nIncrease: "
                      f"£{increase:.0f}"
                  )


                  old_description = (
                      previous_details(
                          old_best
                      )
                  )


                  if old_description:

                      message += (
                          "\n\n"
                          + old_description
                      )


                  message += (
                      "\n\nCurrent cheapest:\n"
                      + details
                  )


                  send_notification(

                      "⚠️ CHEAPER FARE DISAPPEARED",

                      message,

                      priority=priority_for_price(
                          old_price
                      ),

                      tags=[
                          "warning",
                          "airplane",
                          "chart_with_upwards_trend",
                      ],
                  )


                  print(
                      "FARE DISAPPEARANCE / "
                      "PRICE-RISE ALERT SENT"
                  )


              # ========================================================
              # PRICE GOT CHEAPER AGAIN BUT IS NOT A NEW RECORD
              # ========================================================

              elif (
                  previous_price is not None
                  and current_price
                  < float(previous_price) - 0.01
              ):

                  old_price = float(
                      previous_price
                  )

                  saving = (
                      old_price
                      - current_price
                  )


                  # If the old all-time record has returned
                  if (
                      old_lowest is not None
                      and abs(
                          current_price
                          - float(old_lowest)
                      ) <= 0.01
                  ):

                      title = (
                          "✈️ BEST FARE IS BACK"
                      )

                  elif current_price < URGENT_PRICE:

                      title = (
                          "🚨 FARE GOT CHEAPER — UNDER £700"
                      )

                  elif current_price < HIGH_PRIORITY_PRICE:

                      title = (
                          "🔥 FARE GOT CHEAPER — UNDER £750"
                      )

                  else:

                      title = (
                          "✈️ FARE GOT CHEAPER AGAIN"
                      )


                  message = (
                      details
                      + "\n\nWas: "
                      f"£{old_price:.0f}"
                      + "\nNow: "
                      f"£{current_price:.0f}"
                      + "\nDrop: "
                      f"£{saving:.0f}"
                  )


                  if old_lowest is not None:

                      message += (
                          "\nAll-time record: "
                          f"£{float(old_lowest):.0f}"
                      )


                  send_notification(

                      title,

                      message,

                      priority=priority_for_price(
                          current_price
                      ),

                      tags=[
                          "airplane",
                          "chart_with_downwards_trend",
                      ],
                  )


                  print(
                      "CHEAPER-AGAIN ALERT SENT"
                  )


              # ========================================================
              # FARES RETURN AFTER NONE WERE AVAILABLE
              # ========================================================

              elif was_missing:

                  send_notification(

                      "✈️ MATCHING FARES ARE BACK",

                      (
                          "Matching London → Perth "
                          "fares are showing again.\n\n"
                          + details
                      ),

                      priority=priority_for_price(
                          current_price
                      ),

                      tags=[
                          "airplane",
                          "white_check_mark",
                      ],
                  )


                  print(
                      "FARES-RETURNED ALERT SENT"
                  )


              # ========================================================
              # NOTHING IMPORTANT CHANGED
              # ========================================================

              else:

                  print(
                      "No alert needed."
                  )

                  print(
                      "Current cheapest: "
                      f"£{current_price:.0f}"
                  )

                  if old_lowest is not None:

                      print(
                          "All-time record: "
                          f"£{float(old_lowest):.0f}"
                      )


              # ========================================================
              # ALWAYS REMEMBER CURRENT CHEAPEST
              # ========================================================

              state[
                  "availability_missing"
              ] = False

              state[
                  "last_seen_price"
              ] = current_price

              state[
                  "last_best"
              ] = best


              save_state(
                  state
              )

          PY

      - name: Save tracker state
        run: |
          if [ -z "$(git status --porcelain -- .flight-alert-state.json)" ]; then
            echo "No tracker-state change to save."
            exit 0
          fi

          git config user.name "flight-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .flight-alert-state.json

          git commit \
            -m "Update flight tracker state [skip ci]"

          git pull \
            --rebase \
            origin master

          git push \
            origin HEAD:master
